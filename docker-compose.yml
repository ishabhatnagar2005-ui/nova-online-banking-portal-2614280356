services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-nova}
      POSTGRES_USER: ${DB_USERNAME:-nova}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: [nova_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${DB_NAME:-nova}
      DB_USERNAME: ${DB_USERNAME:-nova}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      SERVER_PORT: 8080
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment:
      API_UPSTREAM: http://backend:8080
      NGINX_ENVSUBST_FILTER: ^API_UPSTREAM$
    ports: ["${FRONTEND_PORT:-8080}:80"]
    depends_on: [backend]
volumes:
  nova_data:
